name: Phase 5E validation

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase/5e-controlled-project-state-promotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/5e-controlled-project-state-promotion
          fetch-depth: 0

      - name: Add terminal-only state-promote dispatcher
        shell: python
        run: |
          from pathlib import Path

          path = Path("local-operator/ppo-command.mjs")
          text = path.read_text()

          anchor = '} from "./project-note-approval.mjs";\n'
          addition = anchor + 'import { handleProjectStatePromoteCommand } from "./project-state-promote.mjs";\n'
          if 'from "./project-state-promote.mjs";' not in text:
              if anchor not in text:
                  raise SystemExit("missing project-note-approval import anchor")
              text = text.replace(anchor, addition, 1)

          anchor = '    "  node local-operator/ppo-command.mjs note-add khlim-assist \\"project note text\\"",\n'
          addition = anchor + '    "  node local-operator/ppo-command.mjs state-promote khlim-assist <note-id> current-phase",\n'
          if 'node local-operator/ppo-command.mjs state-promote khlim-assist <note-id> current-phase' not in text:
              if anchor not in text:
                  raise SystemExit("missing terminal usage anchor")
              text = text.replace(anchor, addition, 1)

          anchor = '    "Phase 5D boundary: /ppo note-add stages only; /ppo note-confirm performs the approved single-use local note append."\n'
          addition = '    "Phase 5D boundary: /ppo note-add stages only; /ppo note-confirm performs the approved single-use local note append.",\n    "Phase 5E boundary: terminal state-promote requires PPO_PROJECT_STATE_CONFIRM=promote-note:<project>:<note-id>:<field>; /ppo state-promote remains unsupported."\n'
          if 'Phase 5E boundary: terminal state-promote requires PPO_PROJECT_STATE_CONFIRM' not in text:
              if anchor not in text:
                  raise SystemExit("missing Phase 5D boundary anchor")
              text = text.replace(anchor, addition, 1)

          anchor = '    "- note-add <project> <note...>",\n'
          addition = anchor + '    "- state-promote <project> <note-id> <current-phase|last-known-status|next-action>",\n'
          if '"- state-promote <project> <note-id> <current-phase|last-known-status|next-action>"' not in text:
              if anchor not in text:
                  raise SystemExit("missing terminal additions anchor")
              text = text.replace(anchor, addition, 1)

          anchor = '  if (command === "codex") {\n'
          dispatch = '''  if (command === "state-promote") {
            if (isPpoEnvelope(rawProcessArgs)) {
              console.log(unsupported(rawCommand));
              process.exitCode = 1;
              return;
            }

            if (args.length !== 3) {
              console.log(unsupported(rawCommand));
              process.exitCode = 1;
              return;
            }

            const [projectId, noteId, field] = args;
            const result = await handleProjectStatePromoteCommand(projectId, noteId, field, {
              confirmationValue: process.env.PPO_PROJECT_STATE_CONFIRM
            });
            console.log(result.output);
            process.exitCode = result.ok ? 0 : 1;
            return;
          }

          '''.replace("          ", "")
          if 'command === "state-promote"' not in text:
              if anchor not in text:
                  raise SystemExit("missing codex dispatch anchor")
              text = text.replace(anchor, dispatch + anchor, 1)

          path.write_text(text)

      - name: Node syntax checks
        run: find local-operator deployment openclaw -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Shell syntax checks
        run: find deployment -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Full regression suite
        run: node --test --test-concurrency=1 local-operator/*.test.mjs deployment/*.test.mjs openclaw/plugins/ppo-local/test-bridge.mjs

      - name: Terminal state-promote smoke test
        shell: bash
        run: |
          set -euo pipefail
          target="projects/khlim-assist.md"
          backup="$(mktemp)"
          cp "$target" "$backup"
          cleanup() {
            cp "$backup" "$target"
            rm -f "$backup"
          }
          trap cleanup EXIT

          note_output="$(PPO_NOTE_WRITE_CONFIRM=add-note:khlim-assist node local-operator/ppo-command.mjs note-add khlim-assist 'Phase 5E CLI smoke promotion text.')"
          note_id="$(printf '%s\n' "$note_output" | sed -n 's/^Note ID: //p')"
          test "${#note_id}" -eq 43

          PPO_PROJECT_STATE_CONFIRM="promote-note:khlim-assist:${note_id}:current-phase" \
            node local-operator/ppo-command.mjs state-promote khlim-assist "$note_id" current-phase

          grep -Fq 'Phase 5E CLI smoke promotion text.' "$target"

          if node local-operator/ppo-command.mjs "/ppo state-promote khlim-assist ${note_id} current-phase"; then
            echo '/ppo state-promote unexpectedly succeeded' >&2
            exit 1
          fi

          cleanup
          trap - EXIT
          git diff --exit-code -- "$target"

      - name: Diff whitespace checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Static Phase 5E boundary review
        shell: bash
        run: |
          set -euo pipefail
          file="local-operator/project-state-promote.mjs"
          ! grep -Eqi 'api\.github\.com|openai|chatgpt|workflow_dispatch' "$file"
          ! grep -Eqi 'git (add|commit|push|merge|checkout|reset|branch)' "$file"
          grep -Fq '["rev-parse", "--abbrev-ref", "HEAD"]' "$file"
          grep -Fq '"status"' "$file"

      - name: Finalize validated branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase-5e-validation.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-operator/ppo-command.mjs .github/workflows/phase-5e-validation.yml
          git commit -m "Wire Phase 5E terminal state promotion"
          git push origin HEAD:phase/5e-controlled-project-state-promotion
